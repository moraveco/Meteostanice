services:
  meteostanice:
    image: meteostanice
    build:
      context: .
      dockerfile: Meteostanice/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=data/meteo.db
    volumes:
      - meteo_data:/app/data
      - meteo_logs:/app/logs
    restart: unless-stopped

volumes:
  meteo_data:
  meteo_logs:

